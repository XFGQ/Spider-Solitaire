name: Deploy Spider Solitaire

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: ${{ secrets.DEPLOY_PATH }}/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Health check
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" https://spider.rinnesoft.com)
          if [ "$code" != "200" ]; then
            echo "Deploy doğrulanamadı, HTTP $code döndü"
            exit 1
          fi
          echo "Site canlı, HTTP 200"